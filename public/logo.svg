<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#0f172a"/>

  <!-- Chain links -->
  <!-- Left link -->
  <rect x="8" y="26" width="18" height="12" rx="6" stroke="#06b6d4" stroke-width="3" fill="none"/>
  <!-- Right link -->
  <rect x="38" y="26" width="18" height="12" rx="6" stroke="#06b6d4" stroke-width="3" fill="none"/>
  <!-- Center connector -->
  <line x1="26" y1="32" x2="38" y2="32" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>

  <!-- Node dots at connection points -->
  <circle cx="26" cy="32" r="2.5" fill="#06b6d4"/>
  <circle cx="38" cy="32" r="2.5" fill="#06b6d4"/>

  <!-- Top circuit line -->
  <polyline points="32,14 32,22 26,22 26,26" stroke="#0891b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="32" cy="14" r="2" fill="#0891b2"/>

  <!-- Bottom circuit line -->
  <polyline points="32,50 32,42 38,42 38,38" stroke="#0891b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="32" cy="50" r="2" fill="#0891b2"/>
</svg>
